[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xmvad"
version = "0.1.0"
description = "XMV-AD: Lightweight Modality-Preserving Cross-Attention for Explainable RGB-D Industrial Anomaly Detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "opencv-python>=4.8",
  "Pillow>=10.0",
  "tifffile>=2023.4",
  "imagecodecs",
  "matplotlib>=3.8",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "onnx>=1.15",
  "onnxruntime>=1.17",
  "openvino>=2023.3",
  "captum>=0.7",
  "psutil>=5.9",
  "pytest>=8.0",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3"]
tensorboard = ["tensorboard>=2.15"]
wandb = ["wandb>=0.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
