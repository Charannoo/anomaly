# E1: RGB-only teacher/student baseline (Phase 2).
# No multimodal interaction. Trains one model per category on normal data only.
_base_: default.yaml

experiment: E1_baseline_rgb

data:
  root: data/raw/mvtec3d
  processed_root: data/processed/mvtec3d
  cache_dir: data/cache
  categories: null          # null = all discovered categories
  input_size: [256, 256]    # evaluation resolution; maps + GT compared here
  rgb_mean: [0.485, 0.456, 0.406]
  rgb_std: [0.229, 0.224, 0.225]
  depth_norm: robust_median
  depth_clip: [-3.0, 3.0]
  num_workers: 0            # 0 = safest on Windows; raise on Linux

model:
  name: teacher_student_rgb
  modality: rgb
  rgb_encoder: mobilenetv3_small
  pretrained: true
  freeze_teacher: true
  teacher_taps: {stage8: 3, stage16: 8}  # informative; defined in rgb_encoder.py
  teacher_channels: {stage8: 24, stage16: 48}  # FIXED targets; student heads match these exactly
  level_weights: [0.5, 0.5] # w8, w16
  discrepancy: cosine
  score_mode: max           # max | topk
  topk_frac: 0.01           # used only when score_mode=topk
  smooth_sigma: 0.0         # Gaussian blur sigma on anomaly map; 0 = off

loss:
  lambda_depth: 0.0
  lambda_cross: 0.0

training:
  seed: 42
  epochs: 50
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adamw           # adamw | adam | sgd
  scheduler: plateau        # plateau | step | none
  early_stopping_patience: 0  # 0 = disabled
  amp: false                # CUDA-only; ignored on CPU
  tensorboard: false
  train_on: normal_only

evaluation:
  batch_size: 8
  num_viz: 10               # overlays per class (normal + anomalous)
  num_failures: 5           # top FP + top FN per category

visualization:
  colormap_vmin: 0.0        # FIXED scale for all overlays (never per-image)
  colormap_vmax: 1.0

runtime:
  device: auto              # auto | cpu | cuda
